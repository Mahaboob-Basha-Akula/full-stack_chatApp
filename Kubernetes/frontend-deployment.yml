kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: basha831750/frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: production
        - name: BACKEND_URL
          value: "http://backend:5001"

